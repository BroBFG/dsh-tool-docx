name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # lib/ is committed (installers use the prebuilt package, no build
      # scripts), so a source change must come with its rebuilt lib.
      - name: Verify committed lib is fresh
        run: git diff --exit-code -- lib/
      - name: Test
        run: pnpm test
